name: update-events

on:
  schedule:
    # প্রতি ১২ ঘণ্টা পর পর (UTC সময় 00:00 এবং 12:00 টায়) স্বয়ংক্রিয়ভাবে চলবে
    - cron: '0 0,12 * * *'
  workflow_dispatch: # গিটহাবের Actions ট্যাব থেকে ম্যানুয়ালি Run করার বাটন তৈরি করবে

jobs:
  run-updater:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Updater Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node index.js
