name: Auto Update Sports Schedule

on:
  schedule:
    # প্রতি ৩ ঘণ্টা পর পর রান হবে (limitation এড়াতে সেরা সময়)
    - cron: '0 */3 * * *'
  workflow_dispatch: # চাইলে গিটহাব থেকে ম্যানুয়ালিও রান করা যাবে

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Auto Updater Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node index.js
